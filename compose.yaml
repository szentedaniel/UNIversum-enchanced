# `docker compose up` → the whole app on http://localhost (no provider services).
# Settings: put overrides in .env (see .env.example); the server reads it too.
name: universum

x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # Fixed inside the container, whatever .env says for `pnpm dev`. The port is
    # only reachable on the compose network (Caddy), never published.
    environment:
      HOST: 0.0.0.0
      PORT: "2567"
      DATA_DIR: /data
      # /healthz and /readyz (#43 adds /metrics); compose-network only, never routed by Caddy.
      INTERNAL_PORT: "9464"
    volumes:
      - data:/data
    # Healthy once every unfinished Room is restored (/readyz on the internal port).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9464/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 30s
      start_interval: 1s
      retries: 3
    logging: *logging

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    logging: *logging

volumes:
  # SQLite lives here (DATA_DIR); it survives `docker compose down` (not `down -v`).
  data:
