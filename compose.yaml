# `docker compose up` → the whole app on http://localhost (no provider services).
# `docker compose --profile monitoring up` adds Prometheus + Grafana (opt-in).
# Settings: put overrides in .env (see .env.example); the server reads it too.
name: universum

x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  server:
    build:
      context: .
      target: server
      args:
        # The git SHA, shown as build_info{release} (see README: Running with Docker).
        RELEASE: ${RELEASE:-dev}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # Fixed inside the container, whatever .env says for `pnpm dev`. The port is
    # only reachable on the compose network (Caddy), never published.
    environment:
      HOST: 0.0.0.0
      PORT: "2567"
      DATA_DIR: /data
      # /healthz, /readyz and /metrics; compose-network only, never routed by Caddy.
      INTERNAL_PORT: "9464"
    volumes:
      - data:/data
    # Healthy once every unfinished Room is restored (/readyz on the internal port).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9464/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 30s
      start_interval: 1s
      retries: 3
    logging: *logging

  web:
    build:
      context: .
      target: web
      args:
        RELEASE: ${RELEASE:-dev}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    logging: *logging

  # --- monitoring profile: not started by a plain `docker compose up` ----------
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    # Loopback only: the Prometheus UI and API for this machine.
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - server
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Loopback only, so the dashboard opens without a login (read-only).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/universum.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    logging: *logging

volumes:
  # SQLite lives here (DATA_DIR); it survives `docker compose down` (not `down -v`).
  data:
  # monitoring profile: Prometheus samples (15 days) and Grafana's own state.
  prometheus:
  grafana:
