  - apps/*
  - packages/*

engineStrict: true

catalog:
  "@colyseus/core": 0.18.19
  "@colyseus/sdk": 0.18.5
  "@colyseus/ws-transport": 0.18.4
  "@playwright/test": 1.64.1
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  oxfmt: 0.73.0
  oxlint: 1.88.0
  oxlint-tsgolint: 7.0.2004
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 7.0.2
  vite: 8.3.4
  vitest: 5.0.5
  zod: 4.6.7

allowBuilds:
  msgpackr-extract: false
