# The untracked .claude/ and .agents/ folders are deliberately not listed
# here, so pnpm never installs or runs anything in them.
packages:
  - apps/*
  - packages/*

# Not engineStrict: Dependabot's updater runs an older Node than `engines`
# asks for, and a strict check fails its every npm update. `.node-version`
# and CI's setup-node pin Node 26; pnpm still warns on a mismatch.
engineStrict: false

catalog:
  "@ai-hero/sandcastle": 0.14.0
  "@assetpack/core": 1.7.0
  "@base-ui/react": 1.9.0
  "@colyseus/core": 0.18.19
  "@colyseus/sdk": 0.18.5
  "@colyseus/ws-transport": 0.18.4
  "@fontsource-variable/nunito": 5.3.0
  "@fontsource/sigmar-one": 5.3.0
  "@inlang/paraglide-js": 2.29.0
  "@inlang/plugin-message-format": 4.5.4
  "@playwright/test": 1.64.1
  "@prometheus-io/client": 0.16.1
  "@sentry/core": 11.8.0
  "@sentry/node": 11.8.0
  "@sentry/react": 11.8.0
  "@tailwindcss/vite": 4.3.3
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  fast-check: 4.10.2
  lucide-react: 1.59.0
  oxfmt: 0.73.0
  oxlint: 1.88.0
  oxlint-tsgolint: 7.0.2004
  pino: 10.4.0
  pino-pretty: 13.2.0
  pixi.js: 8.22.0
  pure-rand: 8.4.2
  rate-limiter-flexible: 11.2.3
  react: 19.3.1
  react-dom: 19.3.1
  react-router: 8.4.0
  sharp: 0.34.5
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  uqr: 0.1.3
  vite: 8.3.4
  vitest: 5.0.5
  zod: 4.6.7
  zustand: 5.0.15

allowBuilds:
  msgpackr-extract: false
  # AssetPack (apps/web atlas build) pulls these in. sharp ships prebuilt
  # binaries (@img/sharp-*), and the ffmpeg / cpu-features paths are unused.
  "@ffmpeg-installer/darwin-arm64": false
  "@ffmpeg-installer/linux-x64": false
  "@ffmpeg-installer/linux-arm64": false
  cpu-features: false
  sharp: false

patchedDependencies:
  "@colyseus/sdk@0.18.5": patches/@colyseus__sdk@0.18.5.patch
