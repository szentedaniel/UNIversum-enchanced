# Runs on every pull request and on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      # pnpm comes from `packageManager` in package.json; its store is cached.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec oxfmt --check

      - name: Lint (oxlint --type-aware --type-check)
        run: pnpm run lint

      - name: Type-check (tsc --noEmit per package)
        run: pnpm -r run typecheck

      - name: Unit and server tests
        run: pnpm exec vitest run

      # TEST_HOOKS=1 keeps the Board's test-only hooks in this build, which
      # Playwright drives below; production builds compile them out.
      - name: Build
        run: pnpm --filter @universum/web run build
        env:
          TEST_HOOKS: 1

      - name: Install Playwright browsers
        run: pnpm --filter @universum/e2e exec playwright install --with-deps chromium webkit

      - name: Playwright (desktop Chromium + iPhone WebKit)
        run: pnpm --filter @universum/e2e run test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Smoke test of the compose packaging on main only: the images are built and
  # pushed nowhere.
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: docker compose build
        run: docker compose build
