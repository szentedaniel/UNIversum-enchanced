# One review run of the factory: Claude Code reviews a pull request with Matt
# Pocock's `code-review` skill, commits the fixes it is sure of, and rates the
# merge danger. The owner dispatches it by hand when they want a review now;
# the night cron drains whatever stayed queued.
#
# Labels: `agent:review` is the queue (a queued run leaves it in place); a run
# swaps it for `risk:low` or `risk:high`. A changes-requested review dispatches
# the fix loop (`factory-fix.yml`); a pass leaves the merge gate
# (`factory-merge.yml`) to decide.
name: Factory Review

run-name: Factory review ${{ format('#{0}', inputs.pr || github.event.pull_request.number || 'night queue') }}

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: "The pull request number to review (empty: drain the night queue, as the cron does)"
        required: false
        type: string
  schedule:
    # 01:23 UTC is 02:23 CET or 03:23 CEST: inside the 01:00–07:00 Budapest
    # window in both halves of the year. The gate decides per run, so a
    # dispatch outside the window queues instead.
    # Off the busy top of the hour, plus a backup slot: GitHub delays or drops
    # scheduled runs, and a second run finds the queue already drained.
    - cron: "23 1 * * *"
    - cron: "53 3 * * *"

# The job's own token stays read-only; every write goes through AGENT_PAT,
# which is what makes CI run on the reviewer's push and label chains fire.
permissions:
  contents: read

# One review per pull request: a second run would race the first for the
# branch. The night dispatcher groups separately.
concurrency:
  group: factory-review-${{ github.event.pull_request.number || inputs.pr || 'night' }}
  cancel-in-progress: false

jobs:
  # The cron only dispatches; each dispatched run checks the gate and reviews.
  # One review per pull request still labelled `agent:review`.
  dispatch-queued:
    # The external scheduler (cron-job.org) dispatches with no `pr`: same job.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch one review per queued pull request
        run: |
          set -euo pipefail
          queued=$(gh pr list --state open --label "agent:review" --limit 100 --json number --jq '.[].number')
          if [ -z "$queued" ]; then
            echo "No pull request is queued for review."
            exit 0
          fi
          for pr in $queued; do
            echo "Dispatching a review for pull request #$pr."
            gh workflow run factory-review.yml -f "pr=$pr"
          done

  review:
    # Dependabot's own label event runs without secrets; the night cron
    # dispatches its review instead.
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.pr == '') && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.label.name == 'agent:review')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Check the pull request number
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::The pull request must be a number, got '$PR_NUMBER'."
            exit 1
          fi

      # A label event elsewhere on the pull request must not review it: the
      # queue is exactly the `agent:review` label.
      - name: Preflight
        id: preflight
        run: |
          set -euo pipefail
          info=$(gh pr view "$PR_NUMBER" --json number,state,title,body,headRefName,labels,closingIssuesReferences)
          state=$(jq -r .state <<< "$info")
          if [ "$state" != "OPEN" ]; then
            echo "::notice::Pull request #$PR_NUMBER is $state; there is nothing to review."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          labels=$(jq -r '[.labels[].name] | join(" ")' <<< "$info")
          if [[ " $labels " != *" agent:review "* ]]; then
            echo "::notice::Pull request #$PR_NUMBER is not labelled agent:review; leaving it alone."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          issue=$(jq -r '.closingIssuesReferences[0].number // empty' <<< "$info")
          if [ -z "$issue" ]; then
            issue=$(jq -r .body <<< "$info" \
              | grep -oiE '(closes|fixes|resolves)[[:space:]]+#[0-9]+' \
              | head -n 1 | grep -oE '[0-9]+' || true)
          fi
          {
            echo "proceed=true"
            echo "head_ref=$(jq -r .headRefName <<< "$info")"
            echo "issue=$issue"
          } >> "$GITHUB_OUTPUT"

      # The gate runs main's code, not the pull request's.
      - uses: actions/checkout@v7
        if: steps.preflight.outputs.proceed == 'true'
        with:
          ref: main
          fetch-depth: 0

      # gate.ts runs with plain node, which strips the types from Node 26 on;
      # the runner's default node is older, so set it up before the gate.
      - uses: actions/setup-node@v7
        if: steps.preflight.outputs.proceed == 'true'
        with:
          node-version-file: .node-version

      # Outside the Budapest night window, only the day's quota may review; a
      # queued run leaves `agent:review` in place for the night cron.
      - name: Check the night window and the daytime quota
        id: gate
        if: steps.preflight.outputs.proceed == 'true'
        env:
          FACTORY_DAY_REVIEWS: ${{ vars.FACTORY_DAY_REVIEWS }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          review=$(node packages/factory/src/review/gate.ts)
          echo "review=$review" >> "$GITHUB_OUTPUT"
          if [ "$review" != "true" ]; then
            echo "::notice::Queued: the daytime quota is spent and it is outside the Budapest night window. Pull request #$PR_NUMBER keeps agent:review for the night run."
          fi

      - uses: actions/checkout@v7
        if: steps.preflight.outputs.proceed == 'true' && steps.gate.outputs.review == 'true'
        with:
          ref: ${{ steps.preflight.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT }}

      - name: Configure git
        if: steps.preflight.outputs.proceed == 'true' && steps.gate.outputs.review == 'true'
        run: |
          set -euo pipefail
          git config user.name "universum-factory[bot]"
          git config user.email "universum-factory[bot]@users.noreply.github.com"

      # The same setup as ci.yml: the reviewer runs the repo's own fast checks
      # before it commits a fix.
      - uses: pnpm/action-setup@v6
        if: steps.preflight.outputs.proceed == 'true' && steps.gate.outputs.review == 'true'
        with:
          cache: true

      - name: Install
        if: steps.preflight.outputs.proceed == 'true' && steps.gate.outputs.review == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate messages
        if: steps.preflight.outputs.proceed == 'true' && steps.gate.outputs.review == 'true'
        run: pnpm --filter @universum/web run paraglide

      - name: Install Claude Code
        if: steps.preflight.outputs.proceed == 'true' && steps.gate.outputs.review == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.311

      # The real skill, not a re-written prompt. The version is the pin: a
      # renamed or changed skill fails here instead of reviewing with nothing.
      - name: Install the review skill
        if: steps.preflight.outputs.proceed == 'true' && steps.gate.outputs.review == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if ! claude plugin marketplace list | grep -q "claude-plugins-official"; then
            claude plugin marketplace add anthropics/claude-plugins-official
          fi
          claude plugin install "mattpocock-skills@claude-plugins-official"
          actual=$(claude plugin list --json \
            | jq -r '.[] | select(.id == "mattpocock-skills@claude-plugins-official") | .version')
          if [ "$actual" != "1.3.1" ]; then
            echo "::error::The review skill must be 1.3.1 (the pinned code-review skill); got '$actual'. Update the pin only after re-reading the skill."
            exit 1
          fi
          echo "Review skill: mattpocock-skills@claude-plugins-official $actual"

      - name: Remember the branch tip
        id: tip
        if: steps.preflight.outputs.proceed == 'true' && steps.gate.outputs.review == 'true'
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Review
        if: steps.preflight.outputs.proceed == 'true' && steps.gate.outputs.review == 'true'
        env:
          BRANCH: ${{ steps.preflight.outputs.head_ref }}
          ISSUE_NUMBER: ${{ steps.preflight.outputs.issue }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: node packages/factory/src/review/review.ts

      - name: Push the reviewer's commits
        if: steps.preflight.outputs.proceed == 'true' && steps.gate.outputs.review == 'true'
        env:
          BRANCH: ${{ steps.preflight.outputs.head_ref }}
          WAS: ${{ steps.tip.outputs.head }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "$WAS" ]; then
            echo "The reviewer made no commits; the branch is unchanged."
            exit 0
          fi
          git push origin "HEAD:${BRANCH}"

      # One comment, carrying the hidden marker the daytime quota counts.
      - name: Post the review summary
        if: steps.preflight.outputs.proceed == 'true' && steps.gate.outputs.review == 'true'
        run: gh pr comment "$PR_NUMBER" --body-file "${RUNNER_TEMP}/comment.md"

      - name: Label the verdict
        if: steps.preflight.outputs.proceed == 'true' && steps.gate.outputs.review == 'true'
        run: |
          set -euo pipefail
          verdict=$(jq -r .verdict "${RUNNER_TEMP}/review.json")
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
          gh pr edit "$PR_NUMBER" --remove-label "risk:low" || true
          gh pr edit "$PR_NUMBER" --remove-label "risk:high" || true
          gh pr edit "$PR_NUMBER" --add-label "$(cat "${RUNNER_TEMP}/risk-label.txt")"
          # A changes-requested verdict goes back to omp, which gets two
          # rounds before the owner sees it; a pass clears a stale handoff.
          if [ "$verdict" = "changes-requested" ]; then
            gh workflow run factory-fix.yml -f "pr=$PR_NUMBER" -f reason=review
          else
            gh pr edit "$PR_NUMBER" --remove-label "ready-for-human" || true
          fi

      # A failed review is not left in the queue: it would fail again at night.
      - name: Hand a failed review to a human
        if: failure() && steps.preflight.outputs.proceed == 'true' && steps.gate.outputs.review == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          reason="(no reason file written; check the run log)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body="${RUNNER_TEMP}/failure-comment.md"
          printf 'The factory could not review this pull request.\n\n**Reason:** %s\n\n**Run:** %s\n\nRe-dispatch `factory-review.yml` to retry.\n' "$reason" "$RUN_URL" > "$body"
          gh pr comment "$PR_NUMBER" --body-file "$body" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
          gh pr edit "$PR_NUMBER" --add-label "ready-for-human" || true
