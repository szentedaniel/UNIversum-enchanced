# The factory's heartbeat: one run ticks every ten minutes for about 5.5 hours,
# then dispatches its successor and exits. The cron below is only the safety net
# for a dropped relay; the loop and its duplicate rule live in
# `packages/factory/src/schedule/heartbeat.ts`. A tick dispatches every nightly
# or weekly job that is due and has not run since it fell due, and
# `packages/factory/src/schedule/due.ts` decides what a tick may start. The five
# scheduled workflows no longer carry a cron of their own.
#
# Every job dispatch sets `scheduled=true`; the workflows turn that into the
# `(factory tick)` run-name marker that `schedule/tick.ts` counts, so a manual,
# dry or per-pull-request run never suppresses the scheduled one.
name: Factory Tick

# The runs list tells a dry run from a heartbeat by this name, and a dry run
# waits in its own concurrency group, so it can neither replace the pending
# successor nor make a real start think a heartbeat is alive.
run-name: Factory Tick ${{ github.event_name == 'schedule' && '(cron)' || inputs.dry_run && '(dry run)' || '(heartbeat)' }}

on:
  schedule:
    # Off the busy top of the hour: every ten minutes from :03.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Tick once and print the due jobs without dispatching
        type: boolean
        default: false

# The job's own token stays read-only; every write goes through AGENT_PAT.
permissions:
  contents: read

# One heartbeat at a time: a relayed successor waits here until its predecessor
# exits, and a newer pending run replaces an older one in the queue. A dry run
# takes its own group, so it can neither replace the successor nor stall the
# chain while a heartbeat runs.
concurrency:
  group: factory-tick${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # Above the hand-over and below the job limit; schedule/heartbeat.ts owns
    # both, and its test pins this number between them.
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Heartbeat
        run: node packages/factory/src/schedule/heartbeat-run.ts
