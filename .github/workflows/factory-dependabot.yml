# A new Dependabot pull request enters the factory's review queue. This file
# only labels it; the review, CI and merge steps are the same ones every
# factory pull request takes.
#
# Two hazards decide the shape of this file:
#  - `pull_request_target` runs with the base repository's token, so the job
#    must never check out or run the pull request's code. It doesn't.
#  - A workflow whose triggering actor is `dependabot[bot]` gets no Actions
#    secrets, so the label is added with AGENT_PAT. A label added by the job
#    token triggers no workflow; the PAT's label event is the owner's, which
#    is why the review run it starts has the secrets.
name: Factory Dependabot

run-name: "Factory dependabot #${{ github.event.pull_request.number }}"

on:
  pull_request_target:
    types: [opened]

# The job's own token stays read-only; the label write goes through AGENT_PAT.
permissions:
  contents: read

jobs:
  queue-review:
    # Dependabot itself, not a fork that named its branch `dependabot/…`.
    if: |
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Queue the review
        run: gh pr edit "$PR_NUMBER" --add-label "agent:review"
