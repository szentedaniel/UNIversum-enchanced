# The factory's weekly health report: every Monday at 06:09 Europe/Budapest,
# open the week's `factory:report` issue with the numbers, the budget warning
# and the owner's queue, and close last week's. `packages/factory/src/report/`
# holds the numbers and the body; this file only starts the script.
#
# The nightly tick dispatches it; a repeat dispatch in the same week edits the
# week's issue. A manual dispatch always runs.
name: Factory Report

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the report without writing it
        type: boolean
        default: false

# The report reads its numbers and writes one issue. The default token is
# enough: nothing it does has to trigger another workflow.
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

# A tick's dispatch and a manual one must not both post; the second waits and
# then sees the first's issue.
concurrency:
  group: factory-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # The script's 06:00 Budapest gate only applies to a `schedule` event; the
      # tick dispatches with `workflow_dispatch`, which always runs.
      EVENT_NAME: ${{ github.event_name }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      FACTORY_MONTHLY_MINUTES: ${{ vars.FACTORY_MONTHLY_MINUTES }}

    steps:
      # Plain API work plus the retro log's history: no install, no agent.
      # fetch-depth 0 is what `git log --since` reads the log's added lines from.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Report
        run: node packages/factory/src/report/report.ts
