# The weekly maintenance pass: the factory keeps the codebase healthy while
# nobody is looking. Three independent jobs, each a thin shell around a script
# in `packages/factory/src/maintain/`:
#  - architecture: Claude Code, with the pinned plugin's `codebase-design`
#    vocabulary, proposes at most two deep-module refactors; the script opens
#    one issue each, `ready-for-agent` only for a two-way door.
#  - flaky-tests: the last week's CI logs' Playwright `N flaky` summaries, one
#    `bug` + `ready-for-agent` issue per test name, deduped by title.
#  - handoff-hygiene: handoff notes naming paths git no longer has, one
#    `ready-for-human` issue.
#
# `workflow_dispatch` with dry_run prints what each step would open and writes
# nothing. The gate code and the scripts always run main's copy.
name: Factory Maintain

run-name: Factory maintain ${{ inputs.dry_run && '(dry run)' || (github.event_name == 'schedule' && '(scheduled)' || '(manual)') }}

on:
  schedule:
    # Sunday 02:19 UTC is 03:19 or 04:19 in Budapest: inside the 01:00–07:00
    # night window all year, so the Claude run spends no daytime quota.
    # GitHub delays or drops scheduled runs at busy times (the top of the
    # hour most of all), so the pass has an off-peak slot and a backup slot;
    # the `weekly` job lets only the first scheduled run of the week through.
    - cron: "19 2 * * 0"
    - cron: "49 4 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would be opened, without writing
        type: boolean
        default: false
      max_proposals:
        description: Architecture proposals this run may open (the weekly cap is 2)
        type: number
        default: 2
      focus:
        description: Space-separated paths the architecture pass keeps to (empty is the whole repo)
        type: string
        default: ""

# The jobs' own token stays read-only; every write goes through AGENT_PAT.
permissions:
  contents: read
  actions: read

jobs:
  # A manual run always proceeds; a scheduled one only when no scheduled run
  # of this week already succeeded (the backup slot after a run that landed).
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$SCHEDULED" != "true" ]; then echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          done=$(gh run list --workflow factory-maintain.yml --status success --created ">=$since" \
            --json databaseId,displayTitle \
            --jq "[.[] | select(.databaseId != $RUN_ID and .displayTitle == \"Factory maintain (scheduled)\")] | length")
          if [ "$done" -gt 0 ]; then
            echo "::notice::This week's scheduled pass already ran; the backup slot has nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  architecture:
    needs: weekly
    if: needs.weekly.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      # Full history: the pass weights the code that keeps changing, and
      # `git log --oneline` is how it finds it.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      # Sandcastle imports come from the workspace; the pass needs no build.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.311

      # The same plugin pin as the review step: `codebase-design` is the
      # vocabulary the proposals use, and a renamed skill must fail loudly.
      - name: Install the design skill
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if ! claude plugin marketplace list | grep -q "claude-plugins-official"; then
            claude plugin marketplace add anthropics/claude-plugins-official
          fi
          claude plugin install "mattpocock-skills@claude-plugins-official"
          actual=$(claude plugin list --json \
            | jq -r '.[] | select(.id == "mattpocock-skills@claude-plugins-official") | .version')
          if [ "$actual" != "1.3.1" ]; then
            echo "::error::The plugin must be 1.3.1 (the pinned codebase-design skill); got '$actual'. Update the pin only after re-reading the skill."
            exit 1
          fi
          echo "Design skill: mattpocock-skills@claude-plugins-official $actual"

      - name: Propose the refactors
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAX_PROPOSALS: ${{ inputs.max_proposals }}
          FOCUS: ${{ inputs.focus }}
        run: node packages/factory/src/maintain/run-architecture.ts

  flaky-tests:
    needs: weekly
    if: needs.weekly.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      # The logs are the input: the pass installs nothing.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Find the flaky tests
        run: node packages/factory/src/maintain/run-flaky-tests.ts

  handoff-hygiene:
    needs: weekly
    if: needs.weekly.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      # The notes and git's own tree are the whole input.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Check the handoff notes
        run: node packages/factory/src/maintain/run-handoff-hygiene.ts
